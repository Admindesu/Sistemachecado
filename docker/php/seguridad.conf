# No exponer archivos internos (equivale al bloque "No exponer archivos internos" de
# httpd-checador.conf en XAMPP). Importante porque docker-compose.yml monta todo el repositorio,
# incluido .env con las contraseñas, en /var/www/html.
<Directory /var/www/html>
    Options -Indexes
</Directory>

<DirectoryMatch "^/var/www/html/(\.git|sql|cron|docker|docs|graphify-out)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^\.|\.(md|sql|yml|yaml|bat|log)$|^Dockerfile$">
    Require all denied
</FilesMatch>
