; Ajustes de PHP para el contenedor
date.timezone = ${APP_TZ}
display_errors = Off
log_errors = On
error_log = /dev/stderr
; Los mensajes de deprecación (utf8_decode, FILTER_SANITIZE_STRING) no deben romper los PDF
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

upload_max_filesize = 10M
post_max_size = 12M

session.cookie_httponly = 1
session.use_strict_mode = 1
